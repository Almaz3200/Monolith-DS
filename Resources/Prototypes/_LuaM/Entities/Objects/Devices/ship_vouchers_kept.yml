# LuaM: personal LPC vouchers for Lua-kept ships (Monolith #4624 replaced per-ship vouchers with tier vouchers)

- type: entity
  abstract: true
  parent: BaseShipVoucher
  id: BaseShipLPC # LuaM: removed upstream, still used by _LuaM vouchers
  name: ship LPC
  description: Contains the necessary data for a shipyard console to produce a certain design.
  components:
  - type: Sprite
    sprite: _Mono/Objects/Misc/newlpc.rsi
    state: icon
  - type: ShipyardVoucher
    destroyOnEmpty: false
    cooldown: 1800 # thirty minutes

- type: entity
  parent: BaseShipLPC
  id: ShipVoucherAldebaran
  name: TSF Aldebaran LPC [T1]
  description: A small card that contains the data for the procurement of an Aldebaran-class frigate from the flagship's reserves.
  components:
  - type: Sprite
    sprite: _Mono/Objects/Misc/lpcnew.rsi
    layers:
    - state: icon
    - state: screen
      color: "#05ffff"
    - state: screen2
      color: "#05ffff"
      shader: unshaded
  - type: ShipyardVoucher
    destroyOnEmpty: false
    cooldown: 7200 # one hour
    consoleType: Security
    companyName: TSF
    vessels:
    - Aldebaran
  - type: StaticPrice
    vendPrice: 800000

