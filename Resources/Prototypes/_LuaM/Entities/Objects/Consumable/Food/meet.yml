- type: entity
  name: raw shark meat
  parent: FoodMeatRawBase
  id: FoodMeatBullShark
  description: A slab of raw shark meat.
  components:
  - type: Sprite
    sprite: _LuaM/Objects/Consumable/Meet/bull_shark_meat.rsi
    state: meat
  - type: SolutionContainerManager
    solutions:
      food:
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 9
        - ReagentId: Fat
          Quantity: 5
  - type: InternalTemperature
    conductivity: 0.43
  - type: Construction
    graph: BullSharkSteak
    node: start
    defaultTarget: cooked shark meat
  - type: Tag
    tags:
    - Meat

