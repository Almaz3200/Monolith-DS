- type: entity
  parent: [ClothingEyesGlassesSecurity, ShowMedicalIcons]
  id: ClothingEyesGlassesContractor
  name: contractor glasses
  description: Advanced tactical goggles with multiple visor modes. The lens layer seems so thick that even the stars look blurry through it.
  components:
  - type: Sprite
    sprite:  _LuaM/Clothing/Eyes/Glasses/contractor_glasses.rsi
  - type: Clothing
    sprite: _LuaM/Clothing/Eyes/Glasses/contractor_glasses.rsi
  - type: IdentityBlocker
    coverage: EYES
  - type: ThermalVision
    flashDurationMultiplier: 2
    pulseTime: 2
    isEquipment: true
    toggleAction: PulseThermalVision
  - type: NightVision
    relayOverlay: true
    goggleEffect: true
    viewCircleRadius: 1000
    viewCircleCount: 3
    viewCircleSpacing: 280
    action: ActionToggleNightVision
    phosphorColor: "#c6612f"
    lightingColor: "#ff5500"
    amplification: 2.0
