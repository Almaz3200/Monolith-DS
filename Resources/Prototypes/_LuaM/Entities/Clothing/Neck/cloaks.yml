- type: entity
  parent: ClothingNeckBase
  id: ClothingNeckCloakBlueStar
  name: the cloak of the Blue Star
  description: A warm, cozy cloak that has a woolen layer inside to shield against the cold. On the back, however, an emblem in the shape of a four-pointed star was displayed.
  components:
  - type: Sprite
    sprite: _LuaM/Clothing/Necks/AkiPlash/AkiPlash-base.rsi
    requiredSlot:
    - neck
    slot: head
  - type: ContainerContainer
    containers:
      toggleable-clothing: !type:ContainerSlot {}

