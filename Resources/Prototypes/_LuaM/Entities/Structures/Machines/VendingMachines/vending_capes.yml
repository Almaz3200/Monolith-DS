- type: entity
  parent: VendingMachine
  id: VendingMachineClothingCapes
  name: VendCapes
  description: A machine with various cloaks from different corners of space!
  components:
  - type: VendingMachine
    pack: VendCapesInventory
    offState: off
    brokenState: broken
    normalState: normal-unshaded
    denyState: deny-unshaded
  - type: SpeakOnUIClosed
    pack: GenericVendGoodbyes
  - type: Speech
  - type: Sprite
    sprite: _LuaM/Structures/Machines/VendingMachines/capes.rsi
    layers:
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.Base"]
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.BaseUnshaded"]
      shader: unshaded
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: PointLight
    radius: 1.8
    energy: 1.6
    color: "#7c3bb8"