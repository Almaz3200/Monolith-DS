- type: entity
  parent: [BaseMachinePowered, ConstructibleMachine]
  id: MachineOreMagnet
  name: ore magnet
  description: Uses a powerful magnet to suck ore straight into a linked material silo. # LuaM: Uses a powerful magnet to suck in ore. Has an internal storage. > Uses a powerful magnet to suck ore straight into a linked material silo.
  components:
#  - type: MagnetPickup # Commented by LuaM: the ore goes into the linked silo, see SiloMagnetPickup
#    magnetEnabled: false # Commented by LuaM
#    magnetCanBeEnabled: false # Commented by LuaM
#    range: 30 # Commented by LuaM
# LuaM-start
  - type: SiloMagnetPickup
    range: 30
    whitelist:
      tags:
      - Ore
  - type: OreSiloClient
  - type: MaterialStorage # holds nothing, the silo only links machines that have a material storage
    storageLimit: 0
# LuaM-end
  - type: Sprite
    sprite: Structures/Machines/salvage.rsi
    layers:
    - state: salvage-magnet
    - state: salvage-magnet-o4
      shader: unshaded
      map: [ "enum.PowerDeviceVisualLayers.Powered" ]
    - state: salvage-magnet-ready-blinking
      visible: false
      map: [ "enum.ToggleableVisuals.Layer" ]
  - type: LitOnPowered
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#3db83b"
    castShadows: false
  - type: AmbientSound
    volume: -10
    range: 5
    sound:
      path: /Audio/Ambience/Objects/hdd_buzz.ogg
  - type: Appearance
  - type: ApcPowerReceiver
    powerLoad: 7000
  - type: ExtensionCableReceiver
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 1
            max: 2
  - type: Rotatable
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        density: 500
        mask:
        - MachineMask
        layer:
        - MachineLayer
#  - type: Storage # Commented by LuaM: no internal storage, the ore goes into the linked silo
#    grid: # Commented by LuaM
#    - 0,0,19,9 # Commented by LuaM
#    maxItemSize: Normal # Commented by LuaM
#    storageOpenSound: /Audio/Effects/closetopen.ogg # Commented by LuaM
#    storageCloseSound: /Audio/Effects/closetclose.ogg # Commented by LuaM
#    whitelist: # Commented by LuaM
#      tags: # Commented by LuaM
#      - Ore # Commented by LuaM
#      - ArtifactFragment # Commented by LuaM
#  - type: UserInterface # Commented by LuaM
#    interfaces: # Commented by LuaM
#      enum.StorageUiKey.Key: # Commented by LuaM
#        type: StorageBoundUserInterface # Commented by LuaM
#  - type: Dumpable # Commented by LuaM
#    multiplier: 0.15 # Commented by LuaM
  - type: ItemToggle
    soundActivate: &soundActivate
      collection: sparks
      params:
        variation: 0.25
    soundDeactivate: *soundActivate
    onUse: false
    onAltUse: true
    onActivate: false
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: { visible: True }
          False: { visible: False }
  - type: ItemToggleExamine
    on: item-toggle-examine-magnet-on
    off: item-toggle-examine-magnet-off
  - type: Machine
    board: OreMagnetMachineCircuitboard
  - type: ContainerContainer
    containers:
#      storagebase: !type:Container # Commented by LuaM
#        ents: [] # Commented by LuaM
      machine_board: !type:Container
      machine_parts: !type:Container

- type: entity
  name: ore magnet flatpack
  id: OreMagnetFlatpack
  parent: BaseNFFlatpack
  description: A flatpack used for constructing an ore magnet.
  components:
  - type: Flatpack
    entity: MachineOreMagnet
  - type: StaticPrice
    price: 6500
    vendPrice: 10000
