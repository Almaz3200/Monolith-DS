- type: vessel
  id: Scorpion
  parent: BaseVesselIFFDisabled
  name: vessel-scorpion-name # LuaM-locale
  description: vessel-scorpion-desc # LuaM-locale
  price: 150000
  purchasable: false # voucher only
  category: Large
  group: BlackMarket
  shuttlePath: /Maps/_LuaM/Shuttles/PDV/Scorpion.yml # LuaM: /Maps/_Mono/Shuttles/BlackMarket/skorpion.yml -> /Maps/_LuaM/Shuttles/PDV/Scorpion.yml
  guidebookPage: Null
  class:
  - AntiShipMissileCarrier
  - MissileCarrier
  - Corvette
  engine:
  - Bananium # LuaM Uranium > Bananium
  addComponents: # LuaM add
    - type: IFF
      color: "#E03131FF"
- type: gameMap
  id: Scorpion
  mapName: 'AN Scorpion' # LuaM: 'PDV Scorpion' > 'AN Scorpion'
  mapPath: /Maps/_LuaM/Shuttles/PDV/Scorpion.yml # LuaM: /Maps/_Mono/Shuttles/BlackMarket/skorpion.yml -> /Maps/_LuaM/Shuttles/PDV/Scorpion.yml
  minPlayers: 0
  stations:
    Scorpion:
      stationProto: StandardFrontierVessel
      components:
        - type: StationNameSetup
          mapNameTemplate: 'Scorpion AN{1}' # LuaM: PDV > AN
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: '14'
        - type: StationJobs
          availableJobs:
            Pirate: [ 0, 0 ]
            PdvBorg: [ 0, 0 ]
