- type: entity
  name: handheld crew monitor
  # categories: [ DoNotMap ] # Frontier
  parent: [BaseHandheldComputer, RecyclableItemDeviceSmall] # LuaM RecyclableItemDeviceSmall
  # CMO-only bud, don't add more.
  id: HandheldCrewMonitor
  description: A hand-held crew monitor displaying the status of suit sensors.
  components:
  # LuaM start
  - type: Item
    heldPrefix: scanner
  # LuaM end
  - type: Sprite
    sprite: Objects/Specific/Medical/handheldcrewmonitor.rsi
    # LuaM start
    layers:
    - state: icon
    - state: scanner
      shader: unshaded
      visible: false
      map: [ "enum.PowerDeviceVisualLayers.Powered" ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PowerCellSlotVisuals.Enabled:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
    # LuaM end
  - type: ActivatableUI
    key: enum.CrewMonitoringUIKey.Key
  - type: UserInterface
    interfaces:
      enum.CrewMonitoringUIKey.Key:
        type: CrewMonitoringBoundUserInterface
  - type: CrewMonitoringConsole
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: CrewMonitor
#  - type: WirelessNetworkConnection # Frontier
#    range: 500
#  - type: StationLimitedNetwork
  - type: StaticPrice
    price: 500
  - type: Tag
    tags:
    - HighRiskItem
  - type: StealTarget
    stealGroup:
    - HandheldCrewMonitor

- type: entity
  id: HandheldCrewMonitorEmpty
  parent: HandheldCrewMonitor
  suffix: Empty
  components:
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
