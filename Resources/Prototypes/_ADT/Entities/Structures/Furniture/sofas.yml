# Ported from ADT via Arcane (https://github.com/ArcaneSS14/Arcane) as plain seats.

- type: entity
  name: sofa
  id: ADTSofaBase
  parent: SeatBase
  abstract: true
  description: A big sofa you never want to get up from.
  placement:
    mode: SnapgridCenter
  components:
  - type: Physics
    bodyType: Static
  - type: Transform
    anchored: true
  - type: Rotatable
  - type: StaticPrice
    price: 25
  - type: ShipRepairable
    repairTime: 1
    repairCost: 1

# white office sofa
- type: entity
  name: white office sofa left side
  id: ADTSofaOfficeWhiteLeftSide
  parent: ADTSofaBase
  components:
  - type: Sprite
    sprite: _ADT/Structures/Furniture/Sofas/white_office_sofa.rsi
    state: sofa_left
  - type: Construction
    graph: ADTSofasGraph
    node: ADTSofaOfficeWhiteLeftSideNode

